<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>習慣トラッカー</title>
 
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">
    <!-- ライブラリの読み込み -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-sub: #a0a0a0;
            --bar-color: #00e676; /* 蛍光グリーン */
            --rate-color: #40c4ff; /* 達成率用ブルー */
            --modal-bg: #252525;
 
            /* ランクカラー */
            --bronze: #cd7f32;
            --silver: #e0e0e0;
            --gold: #ffd700;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: var(--text-main);
            padding-bottom: 90px; /* タブバーの分余白を確保 */
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        h1 {
            text-align: center;
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: var(--text-sub);
            font-weight: normal;
            letter-spacing: 2px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        /* --- 画面切り替え用 --- */
        .view-section {
            display: none; /* デフォルトで非表示、JSで制御 */
            animation: fadeIn 0.3s ease;
        }
        .view-section.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* --- タブバー（コンパクト版） --- */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(30, 30, 30, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid #333;
            display: flex;
            justify-content: space-around;
            padding: 8px 0 20px 0;
            z-index: 100;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #666;
            font-size: 10px;
            background: none;
            border: none;
            cursor: pointer;
            width: 50%;
        }
        .nav-item.active {
            color: var(--bar-color);
        }
        .nav-icon {
            font-size: 20px;
            margin-bottom: 2px;
        }
        /* --- 統計画面のスタイル --- */
        .stats-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .stats-header {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            color: var(--text-main);
            border-left: 4px solid var(--bar-color);
            padding-left: 10px;
        }
        .stats-header.rate-header {
            border-left-color: var(--rate-color);
        }
        .big-stats-row {
            display: flex;
            justify-content: space-around;
            text-align: center;
            margin-bottom: 10px;
        }
        .big-stat-item { flex: 1; }
        .big-stat-val { font-size: 28px; font-weight: bold; color: white; }
        .big-stat-label { font-size: 12px; color: var(--text-sub); }
        /* チャートのコンテナ */
        .chart-container {
            position: relative;
            height: 200px;
            width: 100%;
        }
        /* --- 既存スタイル (メイン画面) --- */
        .progress-section {
            background: linear-gradient(145deg, #2a2a2a, #1e1e1e);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 25px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
            transition: all 0.5s ease;
            border: 1px solid transparent;
        }
        .progress-section.all-done {
            box-shadow: 0 0 30px rgba(0, 230, 118, 0.4);
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: end;
            margin-bottom: 10px;
            position: relative;
            z-index: 2;
        }
        .progress-title { font-size: 14px; color: var(--text-sub); }
        .progress-percent { font-size: 32px; font-weight: bold; color: white; line-height: 1; }
        .progress-count { font-size: 16px; color: var(--text-sub); margin-left: 5px; }
 
        .main-progress-bar-bg {
            height: 12px;
            background: rgba(255,255,255,0.1);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
            z-index: 2;
        }
        .main-progress-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--bar-color);
            border-radius: 6px;
            transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 0 0 10px var(--bar-color);
        }
        .complete-msg {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            font-weight: 900;
            color: transparent;
            font-size: 40px;
            pointer-events: none;
            z-index: 10;
            white-space: nowrap;
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            background: linear-gradient(to bottom, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.5));
            letter-spacing: 2px;
        }
        .progress-section.all-done .complete-msg {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.2);
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8), 0 0 40px rgba(255, 140, 0, 0.6);
        }
        .input-area {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 16px;
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        input[type="text"] {
            flex: 1; padding: 12px; background: #2c2c2c;
            border: 1px solid #333; border-radius: 8px;
            font-size: 16px; color: white; outline: none;
        }
        button#add-btn {
            padding: 0 20px; background-color: white; color: black;
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer; white-space: nowrap;
        }
        button#add-btn:active { transform: scale(0.95); }
        .filter-tabs {
            display: flex; justify-content: center; margin-bottom: 25px;
            background: var(--card-bg); padding: 4px; border-radius: 12px;
        }
        .filter-tab {
            flex: 1; padding: 10px; text-align: center; cursor: pointer;
            border-radius: 8px; font-size: 14px; color: var(--text-sub); transition: all 0.2s;
        }
        .filter-tab.active { background-color: #333; color: white; font-weight: bold; }
        .habit-card {
            background: var(--card-bg); margin-bottom: 16px; border-radius: 12px;
            overflow: hidden; position: relative; box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s cubic-bezier(0.4, 0.0, 0.2, 1), box-shadow 0.2s, opacity 0.3s;
            border: 1px solid transparent; cursor: pointer;
        }
        .sortable-ghost { opacity: 0.4; background: #333; }
        .sortable-drag {
            background: #2a2a2a; box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            transform: scale(1.02); z-index: 1000;
        }
        .habit-card:active { transform: scale(0.98); }
        .habit-card.bouncing { animation: bounce 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes bounce {
            0% { transform: scale(1); } 30% { transform: scale(0.95); }
            50% { transform: scale(1.02); } 100% { transform: scale(1); }
        }
 
        .habit-card.rank-bronze { border-color: rgba(205, 127, 50, 0.5); }
        .habit-card.rank-silver { border-color: rgba(224, 224, 224, 0.5); }
        .habit-card.rank-gold   { border-color: rgba(255, 215, 0, 0.5); box-shadow: 0 0 15px rgba(255, 215, 0, 0.15); }
        .card-content {
            padding: 15px 20px; display: flex; align-items: center; justify-content: space-between;
            z-index: 2; position: relative;
        }
        .drag-handle {
            width: 24px; height: 40px; display: flex; flex-direction: column;
            justify-content: center; align-items: center; gap: 3px;
            margin-right: 8px; margin-left: -10px; opacity: 0.2; cursor: grab; touch-action: none;
        }
        .drag-dot { width: 3px; height: 3px; background-color: white; border-radius: 50%; }
        .rank-badge {
            position: absolute; top: 0; right: 0; padding: 2px 8px;
            font-size: 10px; font-weight: bold; border-bottom-left-radius: 8px;
            color: #121212; z-index: 3;
        }
        .rank-bronze .rank-badge { background-color: var(--bronze); }
        .rank-silver .rank-badge { background-color: var(--silver); }
        .rank-gold .rank-badge   { background-color: var(--gold); }
        .habit-info { display: flex; align-items: center; gap: 15px; flex: 1; }
        .habit-icon {
            font-size: 24px; width: 40px; height: 40px;
            background: rgba(255,255,255,0.05); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .habit-text-group { display: flex; flex-direction: column; }
        .habit-title { font-size: 16px; font-weight: 600; color: var(--text-main); }
        .stats-row { display: flex; gap: 10px; font-size: 11px; color: var(--text-sub); margin-top: 4px; }
 
        .check-circle {
            width: 28px; height: 28px; border-radius: 50%; border: 2px solid #555;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: transparent; margin-right: 15px; flex-shrink: 0;
        }
        .habit-card.completed .check-circle { transform: scale(1.1); }
        .check-circle::after {
            content: ''; display: block; width: 6px; height: 10px;
            border: solid black; border-width: 0 2px 2px 0;
            transform: rotate(45deg) scale(0); opacity: 0; transition: all 0.2s ease-out;
        }
        .habit-card.completed .check-circle::after { opacity: 1; transform: rotate(45deg) scale(1); }
        .streak-bar-bg {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 6px;
            background: rgba(255,255,255,0.05);
        }
        .streak-bar-fill {
            height: 100%; width: 0%;
            transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            background-color: var(--bar-color); border-radius: 0 4px 4px 0;
            box-shadow: 0 0 10px var(--bar-color);
        }
        .menu-btn { background: none; border: none; color: #666; font-size: 20px; padding: 10px 5px; cursor: pointer; z-index: 10; }
        /* モーダル等 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center;
            z-index: 1000; opacity: 0; pointer-events: none;
            transition: opacity 0.2s; backdrop-filter: blur(5px);
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: var(--modal-bg); padding: 25px; border-radius: 20px;
            width: 90%; max-width: 350px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transform: scale(0.9); transition: transform 0.2s;
        }
        .modal-overlay.active .modal-content { transform: scale(1); }
        .modal-title { margin-bottom: 20px; font-size: 18px; font-weight: bold; }
        .modal-section { margin-bottom: 20px; }
        .modal-label { display: block; margin-bottom: 10px; color: var(--text-sub); font-size: 12px; }
        .modal-input-text {
            width: 100%; padding: 12px; background: #333;
            border: 1px solid #444; border-radius: 8px;
            color: white; font-size: 16px; outline: none; box-sizing: border-box; text-align: center;
        }
        select#modal-icon-select {
            background: #333; color: white; border: none;
            padding: 12px; border-radius: 12px; font-size: 28px; width: 100%; text-align: center; appearance: none;
        }
        .color-selector { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .color-dot {
            width: 40px; height: 40px; border-radius: 50%;
            cursor: pointer; border: 3px solid transparent; box-sizing: border-box; transition: transform 0.2s;
        }
        .color-dot.selected { border-color: white; transform: scale(1.1); }
        .modal-actions { display: flex; gap: 10px; margin-top: 25px; }
        .modal-btn { flex: 1; padding: 14px; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .btn-cancel { background: #333; color: white; }
        .btn-confirm { background: white; color: black; }
        .action-sheet-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6); z-index: 2000;
            opacity: 0; pointer-events: none; transition: opacity 0.2s;
        }
        .action-sheet-overlay.active { opacity: 1; pointer-events: auto; }
        .action-sheet {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: var(--card-bg); border-top-left-radius: 20px; border-top-right-radius: 20px;
            padding: 20px; transform: translateY(100%); transition: transform 0.3s;
        }
        .action-sheet-overlay.active .action-sheet { transform: translateY(0); }
        .action-btn {
            width: 100%; padding: 15px; margin-bottom: 10px;
            background: #333; border: none; border-radius: 12px;
            color: white; font-size: 16px; font-weight: bold; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .action-btn.delete { color: #ff5252; background: rgba(255, 82, 82, 0.1); }
        .action-btn.cancel { background: transparent; color: #888; margin-bottom: 0; }
        .action-btn.backup { color: #40c4ff; background: rgba(64, 196, 255, 0.1); }
        .action-btn.user-id { color: #ff9800; background: rgba(255, 152, 0, 0.1); }
 
        /* 連携ステータス表示用 */
        .sync-status {
            font-size: 10px; color: #666; margin-top: 5px; text-align: center;
        }
 
        .user-id-display {
            font-size: 12px; color: #888; text-align: center; margin-bottom: 15px;
            padding: 10px; background: rgba(0,0,0,0.2); border-radius: 8px;
        }

        /* 他ユーザー選択モーダル */
        #view-user-modal .modal-content { max-height: 80vh; overflow-y: auto; }
        .view-user-history-list { margin: 8px 0 16px; display: flex; flex-direction: column; gap: 8px; }
        .view-user-history-item {
            display: flex; align-items: center; gap: 8px;
            background: rgba(255,255,255,0.05); border-radius: 10px; padding: 10px 12px;
        }
        .view-user-history-item button.select-btn {
            flex: 1; text-align: left; background: none; border: none;
            color: var(--text-main); font-size: 13px; cursor: pointer; padding: 0;
            word-break: break-all;
        }
        .view-user-history-item button.del-btn {
            background: none; border: none; color: #555; font-size: 16px; cursor: pointer; flex-shrink: 0;
        }
        .view-user-new-input {
            display: flex; gap: 8px; margin-top: 4px;
        }
        .view-user-new-input input {
            flex: 1; background: rgba(255,255,255,0.07); border: 1px solid #444;
            border-radius: 8px; padding: 10px 12px; color: var(--text-main); font-size: 13px;
        }
        .view-user-new-input button {
            background: #3949ab; color: #fff; border: none;
            border-radius: 8px; padding: 10px 14px; font-size: 13px; cursor: pointer;
        }

        /* 他ユーザー閲覧バナー */
        #viewing-banner {
            display: none;
            background: linear-gradient(135deg, #1a237e, #283593);
            border: 1px solid #3949ab;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 16px;
            text-align: center;
        }
        #viewing-banner.active { display: block; }
        #viewing-banner .banner-label {
            font-size: 11px; color: #9fa8da; letter-spacing: 1px; margin-bottom: 4px;
        }
        #viewing-banner .banner-id {
            font-size: 13px; color: #e8eaf6; font-weight: bold; word-break: break-all;
        }
        #viewing-banner .banner-return {
            margin-top: 10px; padding: 6px 16px;
            background: #3949ab; color: #fff; border: none;
            border-radius: 20px; font-size: 12px; cursor: pointer;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>HABIT TRACKER</h1>
    <div id="view-main" class="view-section active">
        <div id="viewing-banner">
            <div class="banner-label">👁 閲覧モード（読み取り専用）</div>
            <div class="banner-id" id="viewing-banner-id"></div>
            <button class="banner-return" onclick="returnToMyData()">← 自分のデータに戻る</button>
        </div>
        <div class="progress-section" id="progress-section">
            <div class="complete-msg">COMPLETE!</div>
            <div class="progress-header">
                <span class="progress-title">今日の進捗</span>
                <div>
                    <span class="progress-percent" id="prog-percent">0%</span>
                    <span class="progress-count" id="prog-count">(0/0)</span>
                </div>
            </div>
            <div class="main-progress-bar-bg">
                <div class="main-progress-bar-fill" id="prog-bar"></div>
            </div>
        </div>
 
        <div class="input-area">
            <input type="text" id="new-habit" placeholder="新しい習慣を追加...">
            <button id="add-btn">追加</button>
        </div>
        <div class="filter-tabs">
            <div class="filter-tab active" id="tab-all" onclick="setFilter('all')">すべて</div>
            <div class="filter-tab" id="tab-unchecked" onclick="setFilter('unchecked')">未完了のみ</div>
        </div>
        <div id="habit-list"></div>
        <div id="sync-status-text" class="sync-status"></div>
 
        <div style="text-align: center; margin-top: 30px;">
            <button class="menu-btn" onclick="openGlobalMenu()">⚙️ 設定・ユーザーID</button>
        </div>
    </div>
    <div id="view-stats" class="view-section">
        <div class="stats-card">
            <div class="stats-header">📊 総合データ</div>
            <div class="big-stats-row">
                <div class="big-stat-item">
                    <div class="big-stat-val" id="stat-total-completed">0</div>
                    <div class="big-stat-label">累計達成数</div>
                </div>
                <div class="big-stat-item">
                    <div class="big-stat-val" id="stat-best-streak">0</div>
                    <div class="big-stat-label">最高継続日数</div>
                </div>
            </div>
        </div>
        <div class="stats-card">
            <div class="stats-header">📅 直近7日間の達成数</div>
            <div class="chart-container">
                <canvas id="weeklyChart"></canvas>
            </div>
        </div>
        <div class="stats-card">
            <div class="stats-header rate-header">📈 直近7日間の達成率</div>
            <div class="chart-container">
                <canvas id="rateChart"></canvas>
            </div>
        </div>
    </div>
</div>
<nav class="bottom-nav">
    <button class="nav-item active" id="nav-home" onclick="switchTab('main')">
        <span class="nav-icon">🏠</span>
        <span>ホーム</span>
    </button>
    <button class="nav-item" id="nav-stats" onclick="switchTab('stats')">
        <span class="nav-icon">📊</span>
        <span>統計</span>
    </button>
</nav>
<div class="modal-overlay" id="edit-modal">
    <div class="modal-content">
        <div class="modal-title" id="modal-title">習慣を編集</div>
        <div class="modal-section">
            <span class="modal-label">習慣の名前</span>
            <input type="text" class="modal-input-text" id="modal-input-name" placeholder="習慣名">
        </div>
        <div class="modal-section">
            <span class="modal-label">目標時間 (分) - 任意</span>
            <input type="number" class="modal-input-text" id="modal-input-time" placeholder="分 (例: 30)" min="0">
        </div>
        <div class="modal-section">
            <span class="modal-label">アイコン</span>
            <select id="modal-icon-select">
                <option value="💪">💪 筋トレ</option>
                <option value="📚">📚 読書</option>
                <option value="🍳">🍳 料理</option>
                <option value="🧹">🧹 掃除</option>
                <option value="💻">💻 作業</option>
                <option value="🏃">🏃 ランニング</option>
                <option value="💧">💧 水分補給</option>
                <option value="💊">💊 サプリ</option>
                <option value="💤">💤 睡眠</option>
                <option value="💰">💰 貯金</option>
                <option value="📝">📝 日記</option>
                <option value="🎸">🎸 趣味</option>
            </select>
        </div>
        <div class="modal-section">
            <span class="modal-label">テーマカラー</span>
            <div class="color-selector" id="modal-color-selector"></div>
        </div>
        <div class="modal-actions">
            <button class="modal-btn btn-cancel" onclick="closeEditModal()">キャンセル</button>
            <button class="modal-btn btn-confirm" onclick="saveHabitData()">保存</button>
        </div>
    </div>
</div>
<div class="modal-overlay" id="view-user-modal">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-title">👁 ユーザーを選択</div>
        <div class="modal-section" id="view-user-history-section" style="display:none;">
            <span class="modal-label">最近見たユーザー</span>
            <div class="view-user-history-list" id="view-user-history-list"></div>
        </div>
        <div class="modal-section">
            <span class="modal-label">IDを入力して見る</span>
            <div class="view-user-new-input">
                <input type="text" id="view-user-input" placeholder="ユーザーID">
                <button onclick="loadViewUserFromInput()">表示</button>
            </div>
        </div>
        <div class="modal-actions">
            <button class="modal-btn btn-cancel" onclick="closeViewUserModal()">キャンセル</button>
        </div>
    </div>
</div>
<div class="action-sheet-overlay" id="action-sheet" onclick="closeActionSheet()">
    <div class="action-sheet" onclick="event.stopPropagation()">
        <button class="action-btn" onclick="openEditModal()">✏️ 編集する</button>
        <button class="action-btn delete" onclick="deleteHabit()">🗑 削除する</button>
        <button class="action-btn cancel" onclick="closeActionSheet()">キャンセル</button>
    </div>
</div>
<div class="action-sheet-overlay" id="global-sheet" onclick="closeGlobalMenu()">
    <div class="action-sheet" onclick="event.stopPropagation()">
        <div class="user-id-display">
            ユーザーID: <span id="display-user-id" style="font-weight:bold; color:white;">-</span>
        </div>
        <button class="action-btn user-id" onclick="changeUserId()">🔄 ユーザーID変更 (引き継ぎ)</button>
        <button class="action-btn" style="background:#1a237e; color:#e8eaf6;" onclick="viewOtherUser()">👁 他のユーザーを見る</button>
        <button class="action-btn backup" onclick="exportData()">📤 バックアップ保存 (ファイル)</button>
        <button class="action-btn backup" onclick="document.getElementById('file-input').click()">📥 データ復元 (インポート)</button>
        <input type="file" id="file-input" style="display: none;" onchange="importData(this)">
        <button class="action-btn cancel" onclick="closeGlobalMenu()">閉じる</button>
    </div>
</div>
<script>
    // ==========================================
    // ▼ GAS連携用設定 (重要)
    // ==========================================
 
    // 【重要】ここにGASで発行した「ウェブアプリURL」を貼り付けてください
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwu_v-ySpPNArZGo5p0EIsnADQy1UfIsw5A7SFu3bVqzOkwM43K_kLlCxpTokSqRVdbww/exec";
    // ==========================================
    // ▲ 設定ここまで
    // ==========================================
 
    // --- 初期化 ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
 
    // ユーザーID管理
    function generateUserId() {
        return 'user_' + Math.random().toString(36).substring(2, 9);
    }
 
    let userId = localStorage.getItem('habit_user_id');
    if (!userId) {
        userId = generateUserId();
        localStorage.setItem('habit_user_id', userId);
    }
    document.getElementById('display-user-id').textContent = userId;
 
    // データ変数
    let habits = JSON.parse(localStorage.getItem('habits')) || [];
    let myHabits = null; // 他ユーザー閲覧中に自分のデータを退避
    let isViewingOther = false;
    let filterMode = 'all';
    let activeIndex = null;
    let isEditing = false;
    let isDragging = false;
    let wasAllDone = false;
    let currentChart = null;
    let currentRateChart = null;
    const colors = ['#ff5252', '#ff9800', '#ffd740', '#69f0ae', '#40c4ff', '#7c4dff', '#ff4081'];
    let selectedColor = colors[3];
 
    // DOM要素
    const habitListEl = document.getElementById('habit-list');
    const inputEl = document.getElementById('new-habit');
    const addBtn = document.getElementById('add-btn');
    const progPercentEl = document.getElementById('prog-percent');
    const progCountEl = document.getElementById('prog-count');
    const progBarEl = document.getElementById('prog-bar');
    const progSectionEl = document.getElementById('progress-section');
    const syncStatusEl = document.getElementById('sync-status-text');
 
    // タブ要素
    const viewMain = document.getElementById('view-main');
    const viewStats = document.getElementById('view-stats');
    const navHome = document.getElementById('nav-home');
    const navStats = document.getElementById('nav-stats');
 
    // --- GAS連携ロジック (マルチユーザー対応) ---
    // 1. クラウドからデータを読み込む
    async function loadFromCloud() {
        if (!GAS_API_URL || GAS_API_URL.includes("ここに")) {
            console.warn("GAS URLが設定されていません。ローカルモードで動作します。");
            return;
        }
 
        habitListEl.style.opacity = "0.5";
        syncStatusEl.textContent = "同期中...";
        try {
            const response = await fetch(`${GAS_API_URL}?userId=${userId}`);
            const cloudData = await response.json();
 
            const isCloudEmpty = !Array.isArray(cloudData) || cloudData.length === 0;
            const hasLocalData = Array.isArray(habits) && habits.length > 0;
            if (isCloudEmpty && hasLocalData) {
                console.log("【新規ID】ローカルデータをクラウドへ保存します...");
                saveToCloud(true);
            }
            else if (Array.isArray(cloudData) && cloudData.length > 0) {
                habits = cloudData;
                localStorage.setItem('habits', JSON.stringify(habits));
                render();
                console.log("クラウドからデータを復元しました");
            }
            syncStatusEl.textContent = "クラウドと同期しました";
            setTimeout(() => { syncStatusEl.textContent = ""; }, 3000);
        } catch (e) {
            console.error("読み込みエラー:", e);
            syncStatusEl.textContent = "同期エラー (オフラインの可能性があります)";
        } finally {
            habitListEl.style.opacity = "1";
        }
    }
 
    // 2. クラウドへデータを保存する
    let saveTimeout;
    function saveToCloud(immediate = false) {
        if (!GAS_API_URL || GAS_API_URL.includes("ここに")) return;
        const performSave = async () => {
            syncStatusEl.textContent = "保存中...";
            try {
                const payload = {
                    userId: userId,
                    habits: habits
                };
                await fetch(GAS_API_URL, {
                    method: "POST",
                    body: JSON.stringify(payload),
                    headers: { "Content-Type": "text/plain" }
                });
                console.log("クラウドに保存完了");
                syncStatusEl.textContent = "保存完了";
                setTimeout(() => { syncStatusEl.textContent = ""; }, 2000);
            } catch (e) {
                console.error("保存エラー:", e);
                syncStatusEl.textContent = "保存失敗";
            }
        };
        clearTimeout(saveTimeout);
        if (immediate) {
            performSave();
        } else {
            saveTimeout = setTimeout(performSave, 1000);
        }
    }
 
    // --- 他ユーザー閲覧機能 ---
    const VIEW_USER_HISTORY_KEY = 'view_user_history';

    function getViewUserHistory() {
        return JSON.parse(localStorage.getItem(VIEW_USER_HISTORY_KEY)) || [];
    }

    function addViewUserHistory(tid) {
        let history = getViewUserHistory();
        history = history.filter(id => id !== tid); // 重複除去
        history.unshift(tid);
        history = history.slice(0, 10); // 最大10件
        localStorage.setItem(VIEW_USER_HISTORY_KEY, JSON.stringify(history));
    }

    function removeViewUserHistory(tid) {
        let history = getViewUserHistory().filter(id => id !== tid);
        localStorage.setItem(VIEW_USER_HISTORY_KEY, JSON.stringify(history));
        renderViewUserModal();
    }

    function renderViewUserModal() {
        const history = getViewUserHistory();
        const section = document.getElementById('view-user-history-section');
        const list = document.getElementById('view-user-history-list');
        if (history.length === 0) {
            section.style.display = 'none';
            return;
        }
        section.style.display = 'block';
        list.innerHTML = '';
        history.forEach(tid => {
            const item = document.createElement('div');
            item.className = 'view-user-history-item';
            item.innerHTML = `
                <button class="select-btn" onclick="loadViewUser('${tid}')">👤 ${tid}</button>
                <button class="del-btn" onclick="removeViewUserHistory('${tid}')" title="履歴から削除">✕</button>
            `;
            list.appendChild(item);
        });
    }

    window.viewOtherUser = () => {
        closeGlobalMenu();
        document.getElementById('view-user-input').value = '';
        renderViewUserModal();
        document.getElementById('view-user-modal').classList.add('active');
    };

    window.closeViewUserModal = () => {
        document.getElementById('view-user-modal').classList.remove('active');
    };

    window.loadViewUserFromInput = () => {
        const tid = document.getElementById('view-user-input').value.trim();
        if (!tid) return;
        loadViewUser(tid);
    };

    window.loadViewUser = async (tid) => {
        closeViewUserModal();
        if (tid === userId) { alert("それはあなた自身のIDです"); return; }

        syncStatusEl.textContent = "読み込み中...";
        try {
            const response = await fetch(`${GAS_API_URL}?userId=${tid}`);
            const data = await response.json();
            if (!Array.isArray(data) || data.length === 0) {
                syncStatusEl.textContent = "";
                alert(`ユーザー「${tid}」のデータが見つかりませんでした`);
                return;
            }
            addViewUserHistory(tid);
            myHabits = habits;
            habits = data;
            isViewingOther = true;
            document.getElementById('viewing-banner-id').textContent = tid;
            document.getElementById('viewing-banner').classList.add('active');
            document.getElementById('new-habit').disabled = true;
            document.getElementById('add-btn').disabled = true;
            sortableInstance.option("disabled", true);
            syncStatusEl.textContent = "";
            render();
        } catch (e) {
            syncStatusEl.textContent = "";
            alert("データの取得に失敗しました");
        }
    };

    window.returnToMyData = () => {
        habits = myHabits;
        myHabits = null;
        isViewingOther = false;
        document.getElementById('viewing-banner').classList.remove('active');
        document.getElementById('new-habit').disabled = false;
        document.getElementById('add-btn').disabled = false;
        setFilter(filterMode);
    };

    // --- ユーザーID変更機能 ---
    window.changeUserId = () => {
        const currentId = localStorage.getItem('habit_user_id');
        const newId = prompt("新しいユーザーIDを入力してください\n(既に使っているIDを入力するとデータを引き継げます)", currentId);
 
        if (newId && newId.trim() !== "" && newId !== currentId) {
            if(confirm("ユーザーIDを変更します。よろしいですか？\n(アプリがリロードされます)")) {
                localStorage.setItem('habit_user_id', newId.trim());
                location.reload();
            }
        }
    };
 
    // =====================================================
    // ▼ 変更点①: 1日の区切りを午前4時にする
    //   現在時刻から4時間引いた上で日付文字列を返す。
    //   例) 午前3:59 → 前日扱い / 午前4:00 → 当日扱い
    // =====================================================
    const getToday = () => {
        const d = new Date();
        // 4時間 (4 * 60 * 60 * 1000 ms) を引いてから日付計算
        const adjusted = new Date(d.getTime() - 4 * 60 * 60 * 1000);
        const offset = adjusted.getTimezoneOffset() * 60000;
        const local = new Date(adjusted.getTime() - offset);
        return local.toISOString().split('T')[0];
    };
 
    // --- 効果音・振動 ---
    function playPopSound() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.15);
    }
 
    function triggerHaptic() {
        if (navigator.vibrate) navigator.vibrate(15);
    }
 
    function playVictorySound() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const playNote = (freq, time, duration) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.value = freq;
            osc.type = 'triangle';
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime + time);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + time + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(audioCtx.currentTime + time);
            osc.stop(audioCtx.currentTime + time + duration);
        };
        playNote(523.25, 0, 0.3); playNote(659.25, 0.1, 0.3); playNote(783.99, 0.2, 0.3);
        playNote(1046.50, 0.3, 0.8); playNote(523.25, 0.3, 0.8);
    }
 
    function triggerConfetti() {
        const end = Date.now() + 3000;
        (function frame() {
            confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ffd700', '#ffffff', '#00e676'] });
            confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ffd700', '#ffffff', '#00e676'] });
            if (Date.now() < end) requestAnimationFrame(frame);
        }());
    }
 
    window.switchTab = (tabName) => {
        playPopSound();
        if (tabName === 'main') {
            viewMain.classList.add('active');
            viewStats.classList.remove('active');
            navHome.classList.add('active');
            navStats.classList.remove('active');
        } else if (tabName === 'stats') {
            viewMain.classList.remove('active');
            viewStats.classList.add('active');
            navHome.classList.remove('active');
            navStats.classList.add('active');
            updateStatsView();
        }
    };
 
    function updateStatsView() {
        let totalCompleted = 0;
        let maxStreakAll = 0;
        habits.forEach(h => {
            totalCompleted += h.completedDates.length;
            const s = calculateStreak(h.completedDates);
            if(s > maxStreakAll) maxStreakAll = s;
        });
        document.getElementById('stat-total-completed').textContent = totalCompleted;
        document.getElementById('stat-best-streak').textContent = maxStreakAll + "日";
 
        const labels = [];
        const dataCounts = [];
        const dataRates = [];
        // 4時間オフセットを適用した「今日」を起点に直近7日を計算
        const todayAdjusted = new Date(new Date().getTime() - 4 * 60 * 60 * 1000);
        const totalHabitsCount = habits.length;
 
        for (let i = 6; i >= 0; i--) {
            const d = new Date(todayAdjusted);
            d.setDate(todayAdjusted.getDate() - i);
            const offset = d.getTimezoneOffset() * 60000;
            const dateStr = new Date(d.getTime() - offset).toISOString().split('T')[0];
 
            labels.push(`${d.getMonth()+1}/${d.getDate()}`);
            let dayCount = 0;
            habits.forEach(h => {
                if (h.completedDates.some(cd => cd === dateStr)) {
                    dayCount++;
                }
            });
            dataCounts.push(dayCount);
            let rate = totalHabitsCount > 0 ? Math.round((dayCount / totalHabitsCount) * 100) : 0;
            dataRates.push(rate);
        }
 
        const ctx = document.getElementById('weeklyChart').getContext('2d');
        if (currentChart) currentChart.destroy();
        currentChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: '達成数',
                    data: dataCounts,
                    borderColor: '#00e676',
                    backgroundColor: 'rgba(0, 230, 118, 0.1)',
                    borderWidth: 3,
                    pointBackgroundColor: '#fff',
                    pointBorderColor: '#00e676',
                    pointRadius: 4,
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { beginAtZero: true, ticks: { color: '#a0a0a0', stepSize: 1 }, grid: { color: '#333' } },
                    x: { ticks: { color: '#a0a0a0' }, grid: { display: false } }
                },
                plugins: { legend: { display: false }, tooltip: { mode: 'index', intersect: false } }
            }
        });
 
        const ctxRate = document.getElementById('rateChart').getContext('2d');
        if (currentRateChart) currentRateChart.destroy();
        currentRateChart = new Chart(ctxRate, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: '達成率(%)',
                    data: dataRates,
                    borderColor: '#40c4ff',
                    backgroundColor: 'rgba(64, 196, 255, 0.1)',
                    borderWidth: 3,
                    pointBackgroundColor: '#fff',
                    pointBorderColor: '#40c4ff',
                    pointRadius: 4,
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 110,
                        ticks: {
                            color: '#a0a0a0',
                            stepSize: 20,
                            callback: function(value) { return value > 100 ? '' : value; }
                        },
                        grid: {
                            color: function(context) { return context.tick.value > 100 ? 'transparent' : '#333'; }
                        }
                    },
                    x: { ticks: { color: '#a0a0a0' }, grid: { display: false } }
                },
                plugins: { legend: { display: false }, tooltip: { mode: 'index', intersect: false } }
            }
        });
    }
 
    // --- バックアップ機能 ---
    function exportData() {
        const dataStr = JSON.stringify(habits);
        const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
        const linkElement = document.createElement('a');
        linkElement.setAttribute('href', dataUri);
        linkElement.setAttribute('download', 'habit_tracker_backup.json');
        linkElement.click();
        window.closeGlobalMenu();
        alert('バックアップを保存しました');
    }
 
    function importData(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const loaded = JSON.parse(e.target.result);
                if (Array.isArray(loaded)) {
                    habits = loaded;
                    localStorage.setItem('habits', JSON.stringify(habits));
                    saveToCloud(true);
                    render();
                    alert('データを復元しました！');
                }
            } catch (err) { alert('読み込み失敗'); }
        };
        reader.readAsText(file);
        window.closeGlobalMenu();
        input.value = '';
    }
 
    const globalSheet = document.getElementById('global-sheet');
    window.openGlobalMenu = () => { globalSheet.classList.add('active'); };
    window.closeGlobalMenu = () => { globalSheet.classList.remove('active'); };
 
    // --- SortableJS ---
    let sortableInstance = Sortable.create(habitListEl, {
        animation: 150, handle: '.drag-handle', delay: 0, disabled: false,
        onStart: function() { isDragging = true; triggerHaptic(); },
        onEnd: function (evt) {
            setTimeout(() => { isDragging = false; }, 100);
            const item = habits.splice(evt.oldIndex, 1)[0];
            habits.splice(evt.newIndex, 0, item);
            localStorage.setItem('habits', JSON.stringify(habits));
            saveToCloud();
        }
    });
 
    // --- カラーパレット初期化 ---
    const modalColorSelector = document.getElementById('modal-color-selector');
    colors.forEach(color => {
        const dot = document.createElement('div');
        dot.className = 'color-dot';
        dot.style.backgroundColor = color;
        dot.onclick = () => {
            playPopSound();
            document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
            dot.classList.add('selected');
            selectedColor = color;
        };
        modalColorSelector.appendChild(dot);
    });
 
    // --- メインロジック ---
    function updateProgress() {
        const today = getToday();
        const total = habits.length;
        if (total === 0) {
            progPercentEl.textContent = "0%"; progCountEl.textContent = "(0/0)";
            progBarEl.style.width = "0%"; progSectionEl.classList.remove('all-done');
            wasAllDone = false; return;
        }
        const done = habits.filter(h => h.completedDates.includes(today)).length;
        const percent = Math.round((done / total) * 100);
 
        progPercentEl.textContent = `${percent}%`;
        progCountEl.textContent = `(${done}/${total})`;
        progBarEl.style.width = `${percent}%`;
 
        if (percent === 100) {
            progSectionEl.classList.add('all-done');
            if (!wasAllDone) {
                triggerConfetti(); playVictorySound();
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                wasAllDone = true;
            }
        } else {
            progSectionEl.classList.remove('all-done');
            wasAllDone = false;
        }
    }
 
    function setFilter(mode) {
        playPopSound();
        filterMode = mode;
        document.getElementById('tab-all').classList.toggle('active', mode === 'all');
        document.getElementById('tab-unchecked').classList.toggle('active', mode === 'unchecked');
        sortableInstance.option("disabled", mode !== 'all' || isViewingOther);
        render();
    }
 
    function render() {
        habitListEl.innerHTML = '';
        updateProgress();
        const today = getToday();
        const visibleHabits = habits.map((h, i) => ({...h, originalIndex: i})).filter(h => {
            if (filterMode === 'all') return true;
            return !h.completedDates.includes(today);
        });
        if (visibleHabits.length === 0) {
            habitListEl.innerHTML = '<p style="text-align:center; color:#555; margin-top:40px;">リストは空です</p>';
            return;
        }
        visibleHabits.forEach((habit) => {
            const index = habit.originalIndex;
            const hIcon = habit.icon || '📝';
            const hColor = habit.color || '#69f0ae';
            const isCompleted = habit.completedDates.includes(today);
            const streak = calculateStreak(habit.completedDates);
            const totalDays = habit.completedDates.length;
            const hTime = habit.time;
 
            let maxDays, rankClass, rankLabel;
            if (streak > 30) { maxDays = 365; rankClass = 'rank-gold'; rankLabel = 'Gold'; }
            else if (streak > 7) { maxDays = 30; rankClass = 'rank-silver'; rankLabel = 'Silver'; }
            else { maxDays = 7; rankClass = 'rank-bronze'; rankLabel = 'Bronze'; }
            let barWidth = Math.min((streak / maxDays) * 100, 100);
            const div = document.createElement('div');
            div.className = `habit-card ${isCompleted ? 'completed' : ''} ${rankClass}`;
            div.id = `card-${index}`;
            const checkStyle = isCompleted ? `background-color: ${hColor}; border-color: ${hColor};` : `border-color: ${hColor};`;
            const iconStyle = `color: ${hColor};`;
            const timeBadge = hTime ? `<span style="font-size:12px; opacity:0.8; margin-left:8px;">⏱ ${hTime}分</span>` : '';
            div.innerHTML = `
                <div class="rank-badge">${rankLabel}</div>
                <div class="streak-bar-bg"><div class="streak-bar-fill" style="width: ${barWidth}%;"></div></div>
                <div class="card-content" onclick="handleCardClick(${index})">
                    <div class="drag-handle"><div class="drag-dot"></div><div class="drag-dot"></div><div class="drag-dot"></div></div>
                    <div class="check-circle" style="${checkStyle}"></div>
                    <div class="habit-info">
                        <div class="habit-icon" style="${iconStyle}">${hIcon}</div>
                        <div class="habit-text-group" style="margin-left: 15px;">
                            <span class="habit-title">${habit.title}</span>
                            <div class="stats-row">
                                <span>🔥 連続: ${streak}日</span>
                                <span>|</span>
                                <span>🏆 累計: ${totalDays}日</span>
                                ${timeBadge}
                            </div>
                        </div>
                    </div>
                    <button class="menu-btn" onclick="openActionSheet(event, ${index})">⋮</button>
                </div>
            `;
            habitListEl.appendChild(div);
        });
    }
 
    // =====================================================
    // ▼ 変更点②: calculateStreak の起点も4時間オフセットに揃える
    //   d を new Date() のままにすると、深夜帯で「今日」と
    //   「前日」が同じ日付になりストリークが二重カウントされる。
    // =====================================================
    function calculateStreak(dates) {
        let streak = 0;
        const now = new Date();
        // 4時間引いた時点を起点にして日付をたどる
        let d = new Date(now.getTime() - 4 * 60 * 60 * 1000);
        let checkStr = getToday(); // 既に4時間オフセット済みの「今日」
 
        if (dates.includes(checkStr)) {
            streak++;
            while (true) {
                d.setDate(d.getDate() - 1);
                const offset = d.getTimezoneOffset() * 60000;
                checkStr = new Date(d.getTime() - offset).toISOString().split('T')[0];
                if (dates.includes(checkStr)) streak++; else break;
            }
        } else {
            d.setDate(d.getDate() - 1);
            const offset = d.getTimezoneOffset() * 60000;
            checkStr = new Date(d.getTime() - offset).toISOString().split('T')[0];
            if (dates.includes(checkStr)) {
                streak++;
                while (true) {
                    d.setDate(d.getDate() - 1);
                    const offset = d.getTimezoneOffset() * 60000;
                    checkStr = new Date(d.getTime() - offset).toISOString().split('T')[0];
                    if (dates.includes(checkStr)) streak++; else break;
                }
            } else { return 0; }
        }
        return streak;
    }
 
    window.handleCardClick = (index) => {
        if (isDragging || isViewingOther) return;
        playPopSound();
        triggerHaptic();
        const card = document.getElementById(`card-${index}`);
        card.classList.remove('bouncing');
        void card.offsetWidth;
        card.classList.add('bouncing');
        toggleHabit(index);
    };
 
    window.toggleHabit = (index) => {
        const today = getToday();
        const dateIndex = habits[index].completedDates.indexOf(today);
        setTimeout(() => {
            if (dateIndex === -1) habits[index].completedDates.push(today);
            else habits[index].completedDates.splice(dateIndex, 1);
            localStorage.setItem('habits', JSON.stringify(habits));
            saveToCloud();
            render();
        }, 150);
    };
 
    const actionSheet = document.getElementById('action-sheet');
    const editModal = document.getElementById('edit-modal');
    const modalTitle = document.getElementById('modal-title');
    const modalInputName = document.getElementById('modal-input-name');
    const modalInputTime = document.getElementById('modal-input-time');
    const modalIconSelect = document.getElementById('modal-icon-select');
 
    window.openActionSheet = (e, index) => {
        e.stopPropagation(); if (isDragging || isViewingOther) return;
        activeIndex = index; actionSheet.classList.add('active');
    };
    window.closeActionSheet = () => { actionSheet.classList.remove('active'); };
 
    addBtn.onclick = () => { startAdd(inputEl.value.trim()); };
 
    function startAdd(initialTitle) {
        playPopSound(); isEditing = false; activeIndex = null;
        modalTitle.textContent = "新しい習慣";
        modalInputName.value = initialTitle;
        modalInputTime.value = '';
        inputEl.value = ''; selectedColor = colors[3]; updateColorSelection();
        editModal.classList.add('active');
    }
 
    window.openEditModal = () => {
        closeActionSheet(); isEditing = true;
        const habit = habits[activeIndex];
        modalTitle.textContent = "習慣を編集";
        modalInputName.value = habit.title;
        modalInputTime.value = habit.time ? habit.time : '';
        modalIconSelect.value = habit.icon; selectedColor = habit.color;
        updateColorSelection(); editModal.classList.add('active');
    };
    window.closeEditModal = () => { editModal.classList.remove('active'); };
 
    function updateColorSelection() {
        document.querySelectorAll('.color-dot').forEach(d => {
            d.classList.remove('selected');
            const modalColorSelector = document.getElementById('modal-color-selector');
            modalColorSelector.innerHTML = '';
            colors.forEach(color => {
                const dot = document.createElement('div');
                dot.className = 'color-dot';
                dot.style.backgroundColor = color;
                if (color === selectedColor) dot.classList.add('selected');
                dot.onclick = () => {
                    playPopSound(); selectedColor = color; updateColorSelection();
                };
                modalColorSelector.appendChild(dot);
            });
        });
    }
 
    window.saveHabitData = () => {
        const name = modalInputName.value.trim();
        const timeVal = modalInputTime.value;
        const timeData = timeVal ? parseInt(timeVal, 10) : null;
        if (!name) { alert('習慣の名前を入力してください'); return; }
        playPopSound();
        const newData = { title: name, icon: modalIconSelect.value, color: selectedColor, time: timeData };
 
        if (isEditing && activeIndex !== null) {
            habits[activeIndex] = { ...habits[activeIndex], ...newData };
        } else {
            habits.push({ ...newData, completedDates: [] });
        }
        localStorage.setItem('habits', JSON.stringify(habits));
        saveToCloud();
        render(); closeEditModal();
    };
 
    window.deleteHabit = () => {
        if(confirm('本当に削除しますか？')) {
            habits.splice(activeIndex, 1);
            localStorage.setItem('habits', JSON.stringify(habits));
            saveToCloud();
            render(); closeActionSheet();
        }
    };
 
    render();
    loadFromCloud();
</script>
</body>
</html>
